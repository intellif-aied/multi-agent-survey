name: multi-agent-survey

services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${LEARNING_BIND_ADDRESS:-0.0.0.0}:${LEARNING_HTTP_PORT:-18089}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../lessons:/usr/share/nginx/html/lessons:ro
      - ../assets:/usr/share/nginx/html/assets:ro
      - ../reference:/usr/share/nginx/html/reference:ro
      - ../walkthrough.md:/usr/share/nginx/html/walkthrough.md:ro
      - ../../AgentTeams/agentteams-controller:/usr/share/nginx/html/agentteams-controller:ro
      - ../../AgentTeams/worker:/usr/share/nginx/html/worker:ro
      - ../../AgentSpace/apps:/usr/share/nginx/html/agentspace/apps:ro
      - ../../AgentSpace/packages:/usr/share/nginx/html/agentspace/packages:ro
      - ../../AgentSpace/walkthrough.md:/usr/share/nginx/html/agentspace/walkthrough.md:ro
    networks:
      - learning
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  learning:
    # Deliberately omit ipam/subnet and static addresses. Docker allocates a
    # free project-scoped bridge range, avoiding collisions with host networks.
    driver: bridge
